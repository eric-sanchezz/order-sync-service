name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      # Tests (Testcontainers uses the runner's Docker), ArchUnit rules, JaCoCo report and its coverage gate.
      - name: Build and test
        run: ./gradlew build
      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          report = ET.parse("build/reports/jacoco/test/jacocoTestReport.xml").getroot()
          print("| Counter | Covered | Total | % |\n|---|---|---|---|")
          for counter in report.findall("counter"):
              missed, covered = int(counter.get("missed")), int(counter.get("covered"))
              print(f"| {counter.get('type')} | {covered} | {missed + covered} | {100 * covered / (missed + covered):.1f} |")
          EOF
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: build/reports/jacoco/test/

  mutation:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v5
      # Only the pure logic's unit tests run here (see the pitest block in build.gradle.kts): no Docker needed.
      - name: Mutation testing
        run: ./gradlew pitest
      - name: Mutation summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import collections
          import xml.etree.ElementTree as ET
          mutations = ET.parse("build/reports/pitest/mutations.xml").getroot()
          statuses = collections.Counter(m.get("status") for m in mutations)
          total = sum(statuses.values())
          print(f"Mutants: {total}, killed: {statuses['KILLED']} ({100 * statuses['KILLED'] / total:.1f}%)\n")
          for status, count in sorted(statuses.items()):
              print(f"- {status}: {count}")
          EOF
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: build/reports/pitest/
