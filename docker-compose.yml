# Demo stack: the service, Postgres, a WireMock "unstable ERP", a WireMock shop (stock API), Kafka (+ kafka-ui),
# Prometheus and Grafana.
# Secrets here are demo values (dev-*); real deployments pass their own.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ordersync
      POSTGRES_USER: ordersync
      POSTGRES_PASSWORD: ordersync
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordersync -d ordersync"]
      interval: 5s
      timeout: 3s
      retries: 10

  erp-mock:
    image: wiremock/wiremock:3.13.1
    # The journal (every request received) is what the resilience run checks for duplicates: keep it bounded but big.
    command: ["--global-response-templating", "--disable-banner", "--max-request-journal-entries=100000"]
    ports:
      - "8089:8080"
    volumes:
      - ./erp-mock:/home/wiremock

  shop-mock:
    image: wiremock/wiremock:3.13.1
    command: ["--global-response-templating", "--disable-banner"]
    ports:
      - "8090:8080"
    volumes:
      - ./shop-mock:/home/wiremock

  # One Kafka node in KRaft mode (broker and controller, no ZooKeeper). Two listeners: kafka:29092 for the other
  # containers, localhost:9092 for clients on the host.
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # A single broker: internal topics cannot have more than one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ordersync
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8080:8080"
    # Management port (health, Prometheus scrape): reachable inside the compose network only, not published.
    expose:
      - "8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ordersync
      DB_USER: ordersync
      DB_PASSWORD: ordersync
      ERP_BASE_URL: http://erp-mock:8080
      SHOP_WEBHOOK_SECRET: dev-webhook-secret
      ADMIN_API_KEY: dev-admin-key
      ERP_WEBHOOK_SECRET: dev-erp-webhook-secret
      SHOP_BASE_URL: http://shop-mock:8080
      SHOP_API_TOKEN: dev-shop-token
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # scripts/resilience-run.sh shortens these two for the load run (see docs/results/README.md); defaults 30s.
      CB_WAIT_OPEN: ${CB_WAIT_OPEN:-30s}
      CIRCUIT_OPEN_DELAY: ${CIRCUIT_OPEN_DELAY:-30s}
    depends_on:
      postgres:
        condition: service_healthy
      erp-mock:
        condition: service_started
      shop-mock:
        condition: service_started
      # The event topics are created when the app starts.
      kafka:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app

  grafana:
    image: grafana/grafana:13.2.4
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: dev-grafana-admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/order-sync.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # Load generator for the resilience run; only started explicitly (docker compose --profile load run k6 ...).
  k6:
    image: grafana/k6:2.3.0
    profiles: ["load"]
    volumes:
      - ./load/k6:/scripts:ro
      - ./docs/results:/results
    environment:
      BASE_URL: http://app:8080
      SHOP_WEBHOOK_SECRET: dev-webhook-secret
    depends_on:
      - app
