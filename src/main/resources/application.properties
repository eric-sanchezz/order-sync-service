spring.application.name=order-sync-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ordersync}
spring.datasource.username=${DB_USER:ordersync}
spring.datasource.password=${DB_PASSWORD:ordersync}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Only API-key auth: no default in-memory user (and no generated password in the log).
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# A fractional quantity (1.9) must be rejected, not truncated to 1.
spring.jackson.deserialization.accept-float-as-int=false

# Actuator lives on its own port (not published by docker-compose; Prometheus scrapes it inside the network).
# On the application port there is no actuator at all.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.liveness.include=ping
management.endpoint.health.group.readiness.include=db
# A degraded integration (circuit breaker not closed) is reported but is not an outage: 200, never DOWN.
management.endpoint.health.status.order=DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
management.endpoint.health.status.http-mapping.DEGRADED=200

# Queue gauges are read from Postgres in the background (never during a scrape), with a short timeout.
ordersync.metrics.db-refresh-interval=${METRICS_DB_REFRESH_INTERVAL:15s}
ordersync.metrics.db-query-timeout=${METRICS_DB_QUERY_TIMEOUT:2s}

# Secrets have no default: the app refuses to start if they are blank.
ordersync.webhook.secret=${SHOP_WEBHOOK_SECRET:}
ordersync.admin.api-key=${ADMIN_API_KEY:}
ordersync.erp-webhook.secret=${ERP_WEBHOOK_SECRET:}
ordersync.shop.api-token=${SHOP_API_TOKEN:}

ordersync.erp.base-url=${ERP_BASE_URL:http://localhost:8089}
ordersync.erp.timeout=${ERP_TIMEOUT:5s}
ordersync.erp.circuit-breaker.sliding-window-size=10
ordersync.erp.circuit-breaker.minimum-number-of-calls=5
ordersync.erp.circuit-breaker.failure-rate-threshold=50
ordersync.erp.circuit-breaker.wait-duration-in-open-state=${CB_WAIT_OPEN:30s}
ordersync.erp.circuit-breaker.permitted-calls-in-half-open-state=1

# One scheduler thread per poller (worker, outbox relay, database gauges): a slow or blocked one must not delay
# the others (by default Spring has a single scheduling thread).
spring.task.scheduling.pool.size=3

ordersync.worker.enabled=${WORKER_ENABLED:true}
ordersync.worker.poll-interval=${WORKER_POLL_INTERVAL:1s}
ordersync.worker.batch-size=${WORKER_BATCH_SIZE:20}
ordersync.worker.lease=60s

ordersync.retry.max-attempts=${RETRY_MAX_ATTEMPTS:5}
ordersync.retry.base-delay=${RETRY_BASE_DELAY:2s}
ordersync.retry.max-delay=${RETRY_MAX_DELAY:5m}
ordersync.retry.jitter=${RETRY_JITTER:true}
ordersync.retry.circuit-open-delay=${CIRCUIT_OPEN_DELAY:30s}

# Stock sync ERP -> shop (transactional outbox). Retries use the ordersync.retry.* settings above.
ordersync.shop.base-url=${SHOP_BASE_URL:http://localhost:8090}
ordersync.shop.timeout=${SHOP_TIMEOUT:5s}
ordersync.shop.circuit-breaker.sliding-window-size=10
ordersync.shop.circuit-breaker.minimum-number-of-calls=5
ordersync.shop.circuit-breaker.failure-rate-threshold=50
ordersync.shop.circuit-breaker.wait-duration-in-open-state=${CB_WAIT_OPEN:30s}
ordersync.shop.circuit-breaker.permitted-calls-in-half-open-state=1

# An ERP stock change stamped further ahead than this is rejected (it would freeze the SKU).
ordersync.stock.max-clock-skew=${STOCK_MAX_CLOCK_SKEW:5m}

ordersync.outbox.relay-enabled=${OUTBOX_RELAY_ENABLED:true}
ordersync.outbox.poll-interval=${OUTBOX_POLL_INTERVAL:1s}
ordersync.outbox.batch-size=${OUTBOX_BATCH_SIZE:20}
ordersync.outbox.lease=60s

# Domain events (OrderSynced, OrderFailed, StockUpdated) to Kafka, through the outbox (ADR 0006).
ordersync.events.kafka.enabled=${EVENTS_KAFKA_ENABLED:true}
ordersync.events.kafka.orders-topic=ordersync.orders.v1
ordersync.events.kafka.stock-topic=ordersync.stock.v1
ordersync.events.kafka.partitions=3
# Longer than delivery.timeout.ms below, well under the outbox lease (60s).
ordersync.events.kafka.send-timeout=${EVENTS_KAFKA_SEND_TIMEOUT:15s}
# Same rules as the erp and shop breakers. While it is open, events wait without using up attempts; retryable
# failures never send an event DEAD anyway (ADR 0006).
ordersync.events.kafka.circuit-breaker.sliding-window-size=10
ordersync.events.kafka.circuit-breaker.minimum-number-of-calls=5
ordersync.events.kafka.circuit-breaker.failure-rate-threshold=50
ordersync.events.kafka.circuit-breaker.wait-duration-in-open-state=${CB_WAIT_OPEN:30s}
ordersync.events.kafka.circuit-breaker.permitted-calls-in-half-open-state=1
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Every in-sync replica must have the event before it counts as sent, and the broker drops the producer's own
# retries of a batch (idempotence). Duplicates across relay retries are still possible: consumers deduplicate by
# the eventId header.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Fail fast instead of blocking a relay thread for a minute when the broker is away; the relay retries later.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
# Must be >= linger.ms + request.timeout.ms.
spring.kafka.producer.properties.delivery.timeout.ms=10000
