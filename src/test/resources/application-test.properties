ordersync.webhook.secret=test-webhook-secret
# Random management port; tests reach it through @LocalManagementPort.
management.server.port=0
# Database gauges refreshed often, so tests can wait for them.
ordersync.metrics.db-refresh-interval=100ms
ordersync.metrics.db-query-timeout=1s
# Plain text, with the MDC correlation fields visible (ObservabilityLoggingTest reads them).
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} [eventId=%X{eventId} jobId=%X{jobId} outboxId=%X{outboxId}] %msg%n
ordersync.admin.api-key=test-admin-key
ordersync.erp-webhook.secret=test-erp-webhook-secret
ordersync.shop.api-token=test-shop-token

# Tests call SyncWorker.pollOnce() and OutboxRelay.pollOnce() themselves.
ordersync.worker.enabled=false
ordersync.outbox.relay-enabled=false
# Small batches so that two concurrent workers both find work (ConcurrentWorkersTest).
ordersync.worker.batch-size=5

ordersync.erp.timeout=1s
ordersync.erp.circuit-breaker.minimum-number-of-calls=1000
ordersync.shop.timeout=1s
ordersync.shop.circuit-breaker.minimum-number-of-calls=1000

ordersync.retry.base-delay=10ms
ordersync.retry.max-delay=50ms
ordersync.retry.jitter=false
ordersync.retry.circuit-open-delay=20ms

# Kafka events are off in the shared test context (its outbox assertions count shop messages only). The Kafka tests
# turn them on in their own context, with a real broker (KafkaIntegrationTest).
ordersync.events.kafka.enabled=false
ordersync.events.kafka.send-timeout=4s
ordersync.events.kafka.circuit-breaker.minimum-number-of-calls=1000
spring.kafka.producer.properties.max.block.ms=1500
spring.kafka.producer.properties.request.timeout.ms=1500
spring.kafka.producer.properties.delivery.timeout.ms=3000
